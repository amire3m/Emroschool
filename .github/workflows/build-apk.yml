name: build-apk
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare keystore
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/app/emroschool-release.keystore
          else
            keytool -genkeypair -v -keystore android/app/emroschool-release.keystore -alias emroschool \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass emroschool -keypass emroschool \
              -dname "CN=Emroschool, OU=App, O=Emroschool, L=Tehran, C=IR" >/dev/null
          fi

      - name: Copy project template
        run: |
          cp -r android-template/* android/
          cp twa-manifest.json android/

      - name: Patch version
        run: |
          VER=$(node -p "require('./package.json').version")
          node -e "
            const fs=require('fs');
            const m=JSON.parse(fs.readFileSync('android/twa-manifest.json','utf8'));
            m.appVersionName=process.argv[1];
            m.appVersionCode=1;
            fs.writeFileSync('android/twa-manifest.json',JSON.stringify(m,null,2)+'\n');
          " "$VER"

      - name: Build release APK
        run: |
          cd android
          gradle wrapper --gradle-version 8.4 --no-daemon
          ./gradlew assembleRelease --no-daemon

      - name: Rename APK
        run: |
          VER=$(node -p "require('./package.json').version")
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk "app-v${VER}.apk" 2>/dev/null || \
          cp android/app/build/outputs/apk/release/*.apk "app-v${VER}.apk" 2>/dev/null || \
          echo "APK not found"
          ls -la *.apk 2>/dev/null

      - name: Compute fingerprint
        run: |
          VER=$(node -p "require('./package.json').version")
          APK="app-v${VER}.apk"
          if [ -f "$APK" ]; then
            keytool -printcert -jarfile "$APK" 2>/dev/null | grep -oE '[0-9A-F:]{2}(:[0-9A-F]{2})+' | head -1 | tr -d ':' | xxd -r -p | base64 | tee fingerprint-b64.txt
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: emroschool-apk
          path: "*.apk"

      - name: Upload fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: emroschool-fingerprint
          path: fingerprint-b64.txt
