name: build-apk
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_VERSION: "2.1.0"
      APP_VERSION_CODE: "2"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Prepare keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p android/app
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/app/emroschool-release.keystore
          else
            keytool -genkeypair -v -keystore android/app/emroschool-release.keystore -alias emroschool \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" \
              -dname "CN=Emroschool, OU=App, O=Emroschool, L=Tehran, C=IR" >/dev/null
          fi
          ls -la android/app/emroschool-release.keystore

      - name: Copy project template
        run: |
          cp -r android-template/* android/
          cp twa-manifest.json android/

      - name: Patch version
        run: |
          node -e "
            const fs=require('fs');
            const m=JSON.parse(fs.readFileSync('android/twa-manifest.json','utf8'));
            m.appVersionName=process.env.APP_VERSION;
            m.appVersionCode=Number(process.env.APP_VERSION_CODE);
            fs.writeFileSync('android/twa-manifest.json',JSON.stringify(m,null,2)+'\n');
          "

      - name: Build release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          cd android
          gradle assembleRelease --no-daemon

      - name: Rename APK
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk "app-v${APP_VERSION}.apk"
          ls -la "app-v${APP_VERSION}.apk"

      - name: Compute fingerprint (SHA-256 base64 of signing cert)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          keytool -exportcert -alias emroschool -keystore android/app/emroschool-release.keystore -storepass "$KEYSTORE_PASSWORD" 2>/dev/null | openssl dgst -sha256 -binary | openssl base64 -A | tee fingerprint-b64.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: emroschool-apk
          path: "*.apk"

      - name: Upload fingerprint
        uses: actions/upload-artifact@v4
        with:
          name: emroschool-fingerprint
          path: fingerprint-b64.txt
