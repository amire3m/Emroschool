name: build-apk
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android cmdline-tools
        run: |
          set -e
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          URL=""
          for v in 13114758 12266719 11076708 10406996 9477386 8512546 7583922; do
            cand="https://dl.google.com/android/repository/commandlinetools-linux-${v}_latest.zip"
            if [ "$(curl -sI -o /dev/null -w '%{http_code}' "$cand")" = "200" ]; then URL="$cand"; break; fi
          done
          [ -n "$URL" ] || { echo "no cmdline-tools url found"; exit 1; }
          echo "using $URL"
          curl -sSf -o /tmp/cmdtools.zip "$URL"
          unzip -q /tmp/cmdtools.zip -d /tmp/cmdtools
          mv /tmp/cmdtools/cmdline-tools "$HOME/android-sdk/cmdline-tools/latest"
          export ANDROID_HOME="$HOME/android-sdk"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-34" "build-tools;34.0.0" >/dev/null 2>&1

      - name: Prepare keystore
        run: |
          mkdir -p android
          if [ -n "${{ secrets.ANDROID_KEYSTORE_B64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_B64 }}" | base64 -d > android/emroschool-release.keystore
          else
            keytool -genkeypair -v -keystore android/emroschool-release.keystore -alias emroschool \
              -keyalg RSA -keysize 2048 -validity 10000 -storepass emroschool -keypass emroschool \
              -dname "CN=Emroschool, OU=App, O=Emroschool, L=Tehran, C=IR" >/dev/null 2>&1
          fi

      - name: Patch version into twa-manifest
        run: |
          VER=$(node -p "require('./package.json').version")
          node -e "const f='twa-manifest.json';const m=require('./'+f);m.appVersionName=process.argv[1];m.appVersionCode=1;require('fs').writeFileSync(f,JSON.stringify(m,null,2)+'\n')" "$VER"

      - name: Bubblewrap init
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          npx --yes @bubblewrap/cli init --manifest="$PWD/twa-manifest.json" --directory="$PWD/android"
          node -e "const f='android/twa-manifest.json';const m=require('./'+f);m.signingKey.path='emroschool-release.keystore';require('fs').writeFileSync(f,JSON.stringify(m,null,2)+'\n')"

      - name: Bubblewrap build
        run: |
          export ANDROID_HOME="$HOME/android-sdk"
          printf 'emroschool\nemroschool\n' | npx --yes @bubblewrap/cli build --directory="$PWD/android" --skipPwaValidation

      - name: Compute base64 fingerprint
        run: |
          set -e
          FP=$(keytool -printcert -jarfile android/app-release-signed.apk 2>/dev/null | grep -oE '[0-9A-F:]{2}(:[0-9A-F]{2})+' | head -1 | tr -d ':')
          echo "$FP" | xxd -r -p | base64 | tee android/fingerprint-b64.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: emroschool-apk
          path: android/app-release-signed.apk

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: emroschool-keystore
          path: android/emroschool-release.keystore

      - name: Upload fingerprint artifact
        uses: actions/upload-artifact@v4
        with:
          name: emroschool-fingerprint
          path: android/fingerprint-b64.txt