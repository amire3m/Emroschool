apply plugin: 'com.android.application'

def twaManifest = new groovy.json.JsonSlurper().parse(file("../twa-manifest.json"))

android {
    namespace twaManifest.packageId
    compileSdk 34

    defaultConfig {
        applicationId twaManifest.packageId
        minSdk 23
        targetSdk 34
        versionCode twaManifest.appVersionCode
        versionName twaManifest.appVersionName
    }

    signingConfigs {
        release {
            storeFile file("../app/emroschool-release.keystore")
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "emroschool"
            keyAlias twaManifest.signingKey?.alias ?: "emroschool"
            keyPassword System.getenv("KEY_PASSWORD") ?: "emroschool"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.4.0'
}
